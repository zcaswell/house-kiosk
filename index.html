<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>House</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <!-- Optional: copy config.local.example.js → config.local.js on the Pi (gitignored). Missing file 404s once in the console; safe to ignore until created. -->
  <script src="config.local.js"></script>
</head>
<body>
  <div class="wash" aria-hidden="true"></div>
  <main class="kiosk">
    <header class="topbar">
      <div class="clock-block">
        <p class="weekday" id="weekday">&nbsp;</p>
        <p class="fulldate" id="fulldate">&nbsp;</p>
        <div class="clock">
          <span id="time" class="time">&nbsp;</span>
          <span id="meridiem" class="meridiem"></span>
        </div>
      </div>

      <section class="weather" id="weather" data-state="loading" aria-live="polite">
        <div class="temp-block">
          <span class="temp" id="wx-temp"></span>
          <span class="degree" id="wx-degree" hidden>°</span>
        </div>
        <div class="wx-copy">
          <p class="condition" id="wx-cond">
            <span class="wx-icon" id="wx-icon" aria-hidden="true"></span>
            <span class="wx-cond-label" id="wx-cond-label"></span>
          </p>
          <p class="hl" id="wx-hl"></p>
        </div>
      </section>
    </header>

    <section class="events" aria-label="Upcoming events">
      <div class="events-head">
        <span class="events-label">Coming up</span>
        <span class="events-rule"></span>
      </div>
      <div class="events-viewport" id="events-viewport">
        <div class="events-track" id="events-track"></div>
      </div>
    </section>

    <footer class="foot">
      <span id="place">Your city</span>
      <span id="sync-status" class="sync-status" data-state="pending">Syncing…</span>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
